[DEFAULT]
training_data = datasets/hcp/rfMRI_REST1_RL.npz,datasets/hcp/rfMRI_REST1_LR.npz
atlas_coordinates = datasets/hcp/atlases/A424_Coordinates.dat
window_length = 200
d_model = 128
num_heads = 4
d_ff = 256
dropout = 0.1
mask_ratio = 0.75
# block types evolution may introduce. Use the full list for a mixed-cell search, or a subset
# (e.g. "attention") to compare an attention-only model against the combination. Valid types:
# attention, simple, sequence_lstm, temporal_lstm (temporal_lstm is decoder-region only, so it
# cannot be the only type).
node_types = attention,simple,sequence_lstm,temporal_lstm
population_size = 5
num_generations = 10
num_iterations = 2
batches_per_iteration = 5
batch_size = 4
learning_rate = 0.001
